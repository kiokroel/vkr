[project]
name = "analytics-service"
version = "0.1.0"
description = "Forecasting and reports service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.1.0",
    "python-jose>=3.3.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
